#pn{position:fixed;top:0;right:0;bottom:0;width:290px;background:#f7f6f2;border-left:1px solid #e3e0d9;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;color:#141414;display:flex;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#pn.drawer.open{transform:none}
#pn.drawer .hd{padding-top:58px}
#pn .hd{padding:16px 16px 10px;border-bottom:1px solid #e3e0d9}
#pn input{width:100%;box-sizing:border-box;font:13px Helvetica,Arial,sans-serif;padding:8px 10px;border:1px solid #d9d6cf;border-radius:6px;background:#fff;color:#141414}
#sel{padding:12px 16px;border-bottom:1px solid #e3e0d9;display:none;max-height:42%;overflow:auto}
#sel h3{margin:0 0 4px;font-size:15px;letter-spacing:1.5px}
#sel .n{font-size:11px;color:#6b6760;margin-bottom:8px}
#sel button.x{float:right;border:0;background:none;font-size:18px;line-height:1;cursor:pointer;color:#6b6760}
#ls{flex:1;overflow:auto;padding:4px 0 60px}
#pn .g{font-size:10.5px;letter-spacing:1.8px;color:#6b6760;padding:14px 16px 4px;font-weight:700}
#pn .tm,#sel .cn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;font:12px Helvetica,Arial,sans-serif;letter-spacing:.8px;color:#141414;padding:6px 16px;cursor:pointer}
#sel .cn{padding:4px 0}
#pn .tm:hover,#sel .cn:hover{background:#ece9e2}
#pn .tm.on{background:#141414;color:#f7f6f2}
#pn .tm i,#sel .cn i{font-style:normal;color:#8a857c;font-size:10.5px}
#pn .tm.on i{color:#cfcac0}
#pn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
#tg{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:6;border:1px solid #d9d6cf;background:#fff;border-radius:18px;padding:8px 14px;font:700 11px Helvetica,Arial,sans-serif;letter-spacing:1.6px;color:#141414;cursor:pointer;display:none}
</style>

sel.addEventListener('click',e=>{if(e.target.closest('.x')){selectIds(null);return}const b=e.target.closest('.cn');if(!b)return;const id=b.dataset.id,t=TERMS.find(t=>t.ids.includes(id));selectIds(t?t.ids:[id],t?t.label:labelOf(id))});
qi.addEventListener('input',renderList);
document.getElementById('tg').onclick=()=>document.getElementById('pn').classList.toggle('open');
build();renderPanel();requestAnimationFrame(frame);
</script>
</body>
</html>
